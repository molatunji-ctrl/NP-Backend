spring.application.name=NpApplication
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# Frontend and authentication cookie configuration
app.frontend.customer-url=${APP_FRONTEND_CUSTOMER_URL:https://nugesphramacy.vercel.app}
app.frontend.admin-url=${APP_FRONTEND_ADMIN_URL:https://np-admin-one.vercel.app}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://nugesphramacy.vercel.app,https://np-admin-one.vercel.app}
app.cookie.name=${AUTH_COOKIE_NAME:jwt}
app.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.cookie.samesite=${AUTH_COOKIE_SAME_SITE:None}
app.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:604800}

# Checkout totals and Flutterwave Standard hosted checkout
app.checkout.shipping-cost=${CHECKOUT_SHIPPING_COST:1500}
app.checkout.vat-rate=${CHECKOUT_VAT_RATE:0.075}
app.checkout.currency=${CHECKOUT_CURRENCY:NGN}
app.checkout.payment-expiry-minutes=${CHECKOUT_PAYMENT_EXPIRY_MINUTES:30}
app.checkout.reservation-grace-minutes=${CHECKOUT_RESERVATION_GRACE_MINUTES:10}
app.checkout.expiry-scan-ms=${CHECKOUT_EXPIRY_SCAN_MS:300000}
flutterwave.api-base-url=${FLUTTERWAVE_API_BASE_URL:https://api.flutterwave.com/v3}
flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
flutterwave.webhook-secret-hash=${FLUTTERWAVE_WEBHOOK_SECRET_HASH:}
flutterwave.max-retry-attempts=${FLUTTERWAVE_MAX_RETRY_ATTEMPTS:3}

# Private prescription documents are stored in PostgreSQL and never exposed
# through public product URLs.
app.prescriptions.max-file-size-bytes=${PRESCRIPTION_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Provider-neutral SMTP delivery. Keep disabled until production credentials
# are configured, then enable verification and email delivery together.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@nugespharmacy.com}
app.mail.brand-name=${MAIL_BRAND_NAME:Nuges Pharmacy}
app.accounts.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
app.accounts.email-verification-ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:1440}
app.accounts.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.test-connection=false

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
