spring.datasource.url=jdbc:h2:mem:npapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-secret-key-for-development-only-1234567890
jwt.expiration=604800000

app.frontend.customer-url=http://localhost:5173
app.frontend.admin-url=http://localhost:5174
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
app.cookie.name=jwt
app.cookie.secure=false
app.cookie.samesite=Lax
app.cookie.max-age-seconds=604800

app.checkout.shipping-cost=1500
app.checkout.vat-rate=0.075
app.checkout.currency=NGN
app.checkout.payment-expiry-minutes=30
app.checkout.reservation-grace-minutes=10
flutterwave.secret-key=test-secret-key
flutterwave.webhook-secret-hash=test-webhook-secret

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
